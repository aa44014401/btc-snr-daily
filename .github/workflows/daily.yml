name: 每日 SNR 圖卡

on:
  schedule:
    # 00:00 UTC = 台北時間 08:00。GitHub 的排程尖峰時可能延遲數十分鐘，屬正常現象。
    - cron: "0 0 * * *"
  workflow_dispatch:        # 也可以在 Actions 頁面手動按一下就跑

permissions:
  contents: write

concurrency:
  group: snr-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝中文字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list :lang=zh-tw | head -3

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 產生圖卡
        run: python main.py

      - name: 準備 Pages 內容
        run: |
          mkdir -p _site
          cp docs/index.html _site/
          cp output/btc_snr.png output/latest.json _site/

      - name: Commit 結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --staged --quiet; then
            echo "沒有變更，略過 commit"
          else
            git commit -m "chore: 更新 SNR 圖卡 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    # Pages 尚未啟用時這個 job 會失敗，但圖卡已經 commit 進 repo，不影響主流程
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
