name: probe2
on: [push, workflow_dispatch]
jobs:
  probe2:
    runs-on: ubuntu-latest
    steps:
      - name: candidate data sources
        run: |
          urls="https://api.okx.com/api/v5/public/time
          https://api.kraken.com/0/public/Time
          https://futures.kraken.com/derivatives/api/v3/instruments
          https://api.exchange.coinbase.com/time
          https://api.binance.us/api/v3/ping
          https://data-api.binance.vision/api/v3/ping
          https://data.binance.vision/
          https://min-api.cryptocompare.com/data/v2/histohour?fsym=BTC&tsym=USDT&limit=2
          https://api.coingecko.com/api/v3/ping
          https://api.bitget.com/api/v2/public/time
          https://api.gateio.ws/api/v4/spot/time
          https://api.mexc.com/api/v3/ping
          https://www.deribit.com/api/v2/public/get_time
          https://api.hyperliquid.xyz/info"
          for u in $urls; do
            code=$(curl -s -o /tmp/o -w '%{http_code}' --max-time 15 "$u" || echo ERR)
            echo "SRC $u -> $code"
          done
      - name: candidate 4h klines
        run: |
          echo "OKX4H $(curl -s --max-time 15 'https://api.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=4H&limit=2' | head -c 220)"
          echo "KRAKENF $(curl -s --max-time 15 'https://futures.kraken.com/api/charts/v1/trade/PF_XBTUSD/4h?from=1780000000' | head -c 220)"
          echo "BITGET4H $(curl -s --max-time 15 'https://api.bitget.com/api/v2/mix/market/candles?symbol=BTCUSDT&granularity=4H&productType=USDT-FUTURES&limit=2' | head -c 220)"
          echo "GATE4H $(curl -s --max-time 15 'https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=BTC_USDT&interval=4h&limit=2' | head -c 220)"
          echo "HYPER $(curl -s --max-time 15 -X POST -H 'Content-Type: application/json' -d '{"type":"metaAndAssetCtxs"}' https://api.hyperliquid.xyz/info | head -c 160)"
