name: probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: runner location
        run: curl -s --max-time 10 https://ipinfo.io/json || true
      - name: exchange endpoint reachability
        run: |
          for u in "https://fapi.binance.com/fapi/v1/ping" "https://fapi1.binance.com/fapi/v1/ping" "https://api.binance.com/api/v3/ping" "https://api.bybit.com/v5/market/time"; do
            code=$(curl -s -o /tmp/o -w '%{http_code}' --max-time 15 "$u" || echo ERR)
            echo "RESULT $u -> $code $(head -c 150 /tmp/o)"
          done
      - name: real klines fetch
        run: |
          code=$(curl -s -o /tmp/k -w '%{http_code}' --max-time 20 "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=4h&limit=3")
          echo "KLINES $code $(head -c 200 /tmp/k)"
      - name: cjk font
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          fc-list :lang=zh-tw | head -2
          ls /usr/share/fonts/opentype/noto/ | head -5
