<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTCUSDT.P SNR 每日圖卡</title>
<style>
  :root{--bg:#0B0E14;--panel:#151A23;--line:#242B36;--txt:#E8EDF4;--mut:#8A94A6;--up:#0ECB81;--dn:#F6465C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:20px}
  img{width:100%;border-radius:14px;border:1px solid var(--line);display:block}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:8px 12px;font-size:13px}
  .chip b{font-variant-numeric:tabular-nums}
  .note{color:#5A6373;font-size:12px;line-height:1.7;margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
  a{color:#5B8DEF}
</style>
</head>
<body>
<div class="wrap">
  <h1>BTCUSDT.P · SNR 每日圖卡</h1>
  <div class="sub" id="sub">載入中…</div>
  <img id="card" src="./btc_snr.png" alt="BTCUSDT.P SNR 策略圖卡">
  <div class="row" id="chips"></div>
  <p class="note">
    本頁內容為 SNR 技術面統計結果，<b>非投資建議</b>。加密貨幣波動劇烈，請自行評估風險並嚴設停損。<br>
    每日 08:00（台北時間）由 GitHub Actions 自動更新；原始數據見
    <a href="./latest.json">latest.json</a>。
  </p>
</div>
<script>
fetch('./latest.json?t=' + Date.now()).then(r => r.json()).then(d => {
  document.getElementById('sub').textContent =
    `${d.updated_tpe}（UTC+8）· 資料來源 ${d.source}`;
  const col = d.change_24h_pct >= 0 ? 'var(--up)' : 'var(--dn)';
  const chips = [
    ['現價', d.price.toLocaleString()],
    ['24H', `<span style="color:${col}">${d.change_24h_pct > 0 ? '+' : ''}${d.change_24h_pct}%</span>`],
    ['RSI (4H)', d.rsi_4h],
    ['ATR (4H)', d.atr_4h.toLocaleString()],
    ['日線結構', d.daily_trend],
  ];
  document.getElementById('chips').innerHTML =
    chips.map(([k, v]) => `<div class="chip">${k} <b>${v}</b></div>`).join('');
  document.getElementById('card').src = './btc_snr.png?t=' + Date.now();
}).catch(() => { document.getElementById('sub').textContent = '尚未有資料'; });
</script>
</body>
</html>
